name: Feature request
description: Suggest a new feature
title: "[feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check [planned features](https://github.com/leohenon/opencode/issues/5) first. If your request is already listed, comment there instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What do you want to see?
    validations:
      required: true
