name: Change request
description: Suggest a change to existing behavior
title: "[change request] "
labels: ["change"]
body:
  - type: markdown
    attributes:
      value: |
        Check [planned features](https://github.com/leohenon/opencode/issues/5) first. If your request is already listed, comment there instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What would you like changed and why?
    validations:
      required: true
