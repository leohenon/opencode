name: CI

on:
  pull_request:
    branches: [vim]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Run vim tests
        run: bun test test/cli/tui/vim-motions.test.ts
        working-directory: packages/opencode
