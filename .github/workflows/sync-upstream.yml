name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vim
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Rebase onto upstream/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sst/opencode.git
          git fetch upstream dev
          git rebase upstream/dev

      - name: Push
        run: git push --force-with-lease origin vim

      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          keep="ci.yml publish-ocv.yml sync-upstream.yml"
          gh api repos/${{ github.repository }}/actions/workflows --paginate -q '.workflows[] | "\(.id) \(.path)"' | while read id path; do
            name=$(basename "$path")
            if echo "$keep" | grep -qw "$name"; then
              continue
            fi
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable" 2>/dev/null || true
          done

      - name: Check for new upstream version
        id: version
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          upstream=$(git log --oneline | grep "^[a-f0-9]* release: v" | head -1 | sed 's/.* release: v//')
          current=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          upstream_base=$(echo "$upstream" | sed -E 's/-(vim|ocv)\..*$//')
          current_base=$(echo "$current" | sed -E 's/-(vim|ocv)\..*$//')
          ocv_prefix="${upstream_base}-ocv."
          vim_prefix="${upstream_base}-vim.2."
          max_ocv=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' | sed 's/^v//' | awk -v p="$ocv_prefix" 'index($0,p)==1' | sed "s/^${ocv_prefix}//" | sort -n | tail -1 || true)
          max_vim=$(gh release list --repo ${{ github.repository }} --limit 200 --json tagName -q '.[].tagName' | sed 's/^v//' | awk -v p="$vim_prefix" 'index($0,p)==1' | sed "s/^${vim_prefix}//" | sort -n | tail -1 || true)
          max=$(printf "%s\n%s\n" "$max_ocv" "$max_vim" | awk 'NF { print }' | sort -n | tail -1)
          if [ -z "$max" ]; then max=-1; fi
          next=$((max + 1))
          release="${upstream_base}-ocv.${next}"
          echo "upstream=$upstream"
          echo "current=$current"
          echo "upstream_base=$upstream_base"
          echo "current_base=$current_base"
          echo "release=$release"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "upstream_base=$upstream_base" >> "$GITHUB_OUTPUT"
          echo "current_base=$current_base" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Trigger release
        if: steps.version.outputs.upstream_base != '' && steps.version.outputs.upstream_base != steps.version.outputs.current_base
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh workflow run publish-ocv.yml --repo ${{ github.repository }} --ref vim -f version=${{ steps.version.outputs.release }}

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --search "Sync upstream failed" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "Sync upstream failed" \
              --body "Sync workflow failed. Likely a rebase conflict. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
