name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vim
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Rebase onto upstream/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sst/opencode.git
          git fetch upstream dev
          git rebase upstream/dev

      - name: Push
        run: git push --force-with-lease origin vim

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          existing=$(gh issue list --search "Sync upstream failed" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Sync upstream failed" \
              --body "Sync workflow failed. Likely a rebase conflict. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
