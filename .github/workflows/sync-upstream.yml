name: Sync with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vim
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Rebase onto upstream/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/sst/opencode.git
          git fetch upstream dev
          git rebase upstream/dev

      - name: Push
        run: git push --force-with-lease origin vim

      - name: Check for new upstream version
        id: version
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          upstream=$(git log --oneline | grep "^[a-f0-9]* release: v" | head -1 | sed 's/.* release: v//')
          current=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' | sed 's/^v//')
          echo "upstream=$upstream"
          echo "current=$current"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Trigger release
        if: steps.version.outputs.upstream != '' && steps.version.outputs.upstream != steps.version.outputs.current
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh workflow run publish-vim.yml --repo ${{ github.repository }} --ref vim -f version=${{ steps.version.outputs.upstream }}

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --search "Sync upstream failed" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo ${{ github.repository }} \
              --title "Sync upstream failed" \
              --body "Sync workflow failed. Likely a rebase conflict. [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
