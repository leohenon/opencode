name: Release ocv

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.20)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vim

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: bun run packages/opencode/script/build.ts --single=false
        env:
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Package binaries
        shell: bash
        run: |
          DIST="packages/opencode/dist"
          mkdir -p "$DIST/release"

          for dir in $DIST/opencode-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            target="${name/opencode/ocv}"

            if [[ "$name" == *linux* ]]; then
              tar -czf "$DIST/release/$target.tar.gz" -C "$dir/bin" .
            else
              (cd "$dir/bin" && zip -r "../../release/$target.zip" .)
            fi
          done

          ls -lh "$DIST/release/"

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          DIST="packages/opencode/dist/release"

          gh release create "v$VERSION" \
            --title "ocv v$VERSION" \
            --notes "Based on opencode v$VERSION with vim mode" \
            --repo "$GITHUB_REPOSITORY" \
            "$DIST"/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
