name: Release ocv

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.20)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TRACK=$(tr -d '[:space:]' < .github/ocv-track)
          if ! printf '%s' "$TRACK" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "Invalid ocv track: '$TRACK'"
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-ocv\.[0-9]+\.[0-9]+$'; then
            echo "Invalid ocv version: '$VERSION'"
            exit 1
          fi
          if [ "${VERSION##*-ocv.}" != "$TRACK" ]; then
            echo "Version track '${VERSION##*-ocv.}' does not match pinned track '$TRACK'"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Add release contributors
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          PREV_TAG=$(git tag --list 'v*-ocv.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-ocv\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous ocv release found, skipping contributor update"
            exit 0
          fi

          bun script/update-contributors.ts --from "$PREV_TAG" --to HEAD --repo "$GITHUB_REPOSITORY" --base ocv
          if git diff --quiet README.md; then
            exit 0
          fi

          git add README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: add release contributors"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build CLI
        run: bun run packages/opencode/script/build.ts --single=false
        env:
          OPENCODE_VERSION: ${{ inputs.version }}

      - name: Package binaries
        shell: bash
        run: |
          DIST="packages/opencode/dist"
          mkdir -p "$DIST/release"

          for dir in $DIST/opencode-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            target="${name/opencode/ocv}"
            bin="$dir/bin/opencode"
            if [ ! -f "$bin" ]; then
              bin="$dir/bin/opencode.exe"
            fi

            if [[ "$name" == *windows* ]]; then
              cp "$bin" "$DIST/release/$target.exe"
            else
              cp "$bin" "$DIST/release/$target"
            fi

            if [[ "$name" == *linux* ]]; then
              tar -czf "$DIST/release/$target.tar.gz" -C "$dir/bin" .
            else
              (cd "$dir/bin" && zip -r "../../release/$target.zip" .)
            fi
          done

          ls -lh "$DIST/release/"

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          BASE="${VERSION%%-ocv.*}"
          PATCH="${VERSION##*-ocv.}"
          NOTES_FILE="$RUNNER_TEMP/ocv-release-notes.txt"
          PRS_FILE="$RUNNER_TEMP/ocv-release-prs.txt"
          PREV_TAG=$(git tag --list 'v*-ocv.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-ocv\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | head -n 1 || true)
          PREV_PATCH=""

          if [ -n "$PREV_TAG" ]; then
            PREV_PATCH="${PREV_TAG##*-ocv.}"
            git log --first-parent --reverse --format='%H' "$PREV_TAG"..HEAD | while read -r sha; do
              gh api "repos/${{ github.repository }}/commits/$sha/pulls" -q '.[] | select(.base.ref == "ocv") | "\(.number)\t\(.title)\t\(.user.login // "")"' || true
            done | awk -F '\t' '!seen[$1]++' | while IFS=$'\t' read -r num title author; do
              [ -n "$num" ] || continue
              if [ -n "$author" ]; then
                echo "$title - #$num (@$author)"
                continue
              fi
              echo "$title - #$num"
            done > "$PRS_FILE"
          else
            : > "$PRS_FILE"
          fi

          echo "based on opencode v$BASE" > "$NOTES_FILE"

          if [ -s "$PRS_FILE" ] || { [ -n "$PREV_PATCH" ] && [ "$PATCH" != "$PREV_PATCH" ]; }; then
            {
              echo
              echo "ocv patch $PATCH"
              cat "$PRS_FILE"
            } >> "$NOTES_FILE"
          fi

          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          DIST="packages/opencode/dist/release"
          NOTES_FILE="${{ steps.notes.outputs.file }}"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "$DIST"/*
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              "$DIST"/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Compute checksums
        id: sum
        shell: bash
        run: |
          DIST="packages/opencode/dist/release"
          echo "darwin_arm64=$(shasum -a 256 "$DIST/ocv-darwin-arm64.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(shasum -a 256 "$DIST/ocv-darwin-x64.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(shasum -a 256 "$DIST/ocv-linux-arm64.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(shasum -a 256 "$DIST/ocv-linux-x64.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        id: checkout_tap
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: leohenon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        id: update_formula
        if: steps.checkout_tap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          DARWIN_ARM64="${{ steps.sum.outputs.darwin_arm64 }}"
          DARWIN_X64="${{ steps.sum.outputs.darwin_x64 }}"
          LINUX_ARM64="${{ steps.sum.outputs.linux_arm64 }}"
          LINUX_X64="${{ steps.sum.outputs.linux_x64 }}"
          cat > tap/Formula/ocv.rb <<EOF
          class Ocv < Formula
            desc "OpenCode with Vim keybindings - AI coding assistant for the terminal"
            homepage "https://github.com/leohenon/opencode-vim"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/leohenon/opencode-vim/releases/download/v${VERSION}/ocv-darwin-arm64.zip"
                sha256 "${DARWIN_ARM64}"
              else
                url "https://github.com/leohenon/opencode-vim/releases/download/v${VERSION}/ocv-darwin-x64.zip"
                sha256 "${DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/leohenon/opencode-vim/releases/download/v${VERSION}/ocv-linux-arm64.tar.gz"
                sha256 "${LINUX_ARM64}"
              else
                url "https://github.com/leohenon/opencode-vim/releases/download/v${VERSION}/ocv-linux-x64.tar.gz"
                sha256 "${LINUX_X64}"
              end
            end

            def install
              bin.install "opencode" => "ocv"
            end

            test do
              assert_match version.to_s, shell_output("\#{bin}/ocv --version", 2)
            end
          end
          EOF

      - name: Push formula
        id: push_formula
        if: steps.checkout_tap.outcome == 'success' && steps.update_formula.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd tap
          git add Formula/ocv.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, skipping push"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update ocv formula v${{ inputs.version }}"
          git push

      - name: Close Homebrew failure issue
        if: steps.checkout_tap.outcome == 'success' && steps.update_formula.outcome == 'success' && steps.push_formula.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Homebrew tap update failed for v${{ inputs.version }}"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | first | .number // \"\"")
          if [ -z "$NUMBER" ]; then
            echo "No open Homebrew failure issue found"
            exit 0
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Closed automatically after a successful Homebrew tap update: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Create Homebrew failure issue
        if: steps.checkout_tap.outcome == 'failure' || steps.update_formula.outcome == 'failure' || steps.push_formula.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Homebrew tap update failed for v${{ inputs.version }}"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          The ocv release workflow failed to update the Homebrew tap for \`v${{ inputs.version }}\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$BODY_FILE"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        id: npm_publish
        continue-on-error: true
        run: bun run packages/opencode/script/publish-ocv-npm.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Close npm failure issue
        if: steps.npm_publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="npm publish failed for v${{ inputs.version }}"
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | first | .number // \"\"")
          if [ -z "$NUMBER" ]; then
            echo "No open npm failure issue found"
            exit 0
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Closed automatically after a successful npm publish: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Create npm failure issue
        if: steps.npm_publish.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="npm publish failed for v${{ inputs.version }}"
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          The ocv release workflow failed to publish \`@leohenon/ocv@${{ inputs.version }}\` to npm.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already exists: $TITLE"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$BODY_FILE"

      - name: Fail release on publish errors
        if: steps.npm_publish.outcome == 'failure' || steps.checkout_tap.outcome == 'failure' || steps.update_formula.outcome == 'failure' || steps.push_formula.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more release distribution steps failed"
          exit 1
